<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | JunifyDB Console</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #16161f;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #8899a8;
            --success: #10b981;
            --success-light: #6ee7b7;
            --error: #f43f5e;
            --error-light: #fda4af;
            --warning: #f59e0b;
            --warning-light: #fcd34d;
            --border: #2e2e3a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 5px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            color: white;
            box-shadow: var(--shadow);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-label .required {
            color: var(--error);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .message {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
            border-left: 4px solid;
        }

        .message svg { width: 18px; height: 18px; flex-shrink: 0; }
        .message.error {
            display: flex;
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error-light);
        }
        .message.success {
            display: flex;
            background: rgba(34, 197, 94, 0.1);
            border-color: var(--success);
            color: var(--success-light);
        }
        .message.info {
            display: flex;
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-light);
        }

        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-fill.weak { width: 25%; background: var(--error); }
        .strength-fill.fair { width: 50%; background: var(--warning); }
        .strength-fill.good { width: 75%; background: var(--success); }
        .strength-fill.strong { width: 100%; background: var(--success-light); }

        .strength-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">J</div>
                <h1>Reset Password</h1>
                <p>Enter your new password below</p>
            </div>

            <div id="message" class="message"></div>

            <form id="resetForm" onsubmit="handleReset(event)">
                <input type="hidden" id="token" value="">
                
                <div class="form-group">
                    <label class="form-label" for="newPassword">
                        New Password
                        <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="newPassword"
                        class="form-input"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                        minlength="12"
                    >
                    <div id="passwordStrength" class="password-strength">
                        <div class="strength-bar">
                            <div id="strengthFill" class="strength-fill"></div>
                        </div>
                        <div id="strengthText" class="strength-text"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        Confirm Password
                        <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-input"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn" id="resetBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Reset Password
                </button>
            </form>

            <a href="login.html" class="back-link">← Back to Login</a>
        </div>
    </div>

    <script>
        const API = '/api';
        let authToken = '';

        // Get token from URL
        function init() {
            const params = new URLSearchParams(window.location.search);
            authToken = params.get('token');
            
            if (!authToken) {
                showMessage('Invalid or missing reset token. Please request a new password reset.', 'error');
                document.getElementById('resetBtn').disabled = true;
            } else {
                document.getElementById('token').value = authToken;
            }
        }

        function calculatePasswordStrength(password) {
            let score = 0;
            
            if (password.length >= 8) score += 20;
            if (password.length >= 12) score += 20;
            if (/[a-z]/.test(password)) score += 15;
            if (/[A-Z]/.test(password)) score += 15;
            if (/[0-9]/.test(password)) score += 15;
            if (/[^a-zA-Z0-9]/.test(password)) score += 15;
            
            if (score < 40) return { level: 'weak', label: 'Weak' };
            if (score < 60) return { level: 'fair', label: 'Fair' };
            if (score < 80) return { level: 'good', label: 'Good' };
            return { level: 'strong', label: 'Strong' };
        }

        // Password strength meter
        document.getElementById('newPassword').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthEl = document.getElementById('passwordStrength');
            const fillEl = document.getElementById('strengthFill');
            const textEl = document.getElementById('strengthText');
            
            if (password.length === 0) {
                strengthEl.style.display = 'none';
                return;
            }
            
            strengthEl.style.display = 'block';
            
            const strength = calculatePasswordStrength(password);
            
            fillEl.className = 'strength-fill ' + strength.level;
            textEl.textContent = strength.label;
        });

        async function handleReset(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Validate password strength
            const strength = calculatePasswordStrength(newPassword);
            if (strength.level === 'weak' || strength.level === 'fair') {
                showMessage('Password is too weak. Please choose a stronger password.', 'error');
                return;
            }
            
            // Disable button during reset
            resetBtn.disabled = true;
            resetBtn.innerHTML = `
                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" opacity="0.3"/>
                    <path d="M12 2a10 10 0 0 1 10 10"/>
                </svg>
                Resetting...
            `;
            
            try {
                const response = await fetch(`${API}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: authToken,
                        newPassword 
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Password reset successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Password reset failed. Token may have expired.', 'error');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        Reset Password
                    `;
                }
            } catch (error) {
                console.error('Reset error:', error);
                showMessage('Connection error. Please try again.', 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Reset Password
                `;
            }
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            const icons = {
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            
            messageEl.innerHTML = icons[type] + '<span>' + message + '</span>';
            messageEl.className = `message ${type}`;
        }

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
