<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JunifyDB Console</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #16161f;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --success: #10b981;
            --success-light: #6ee7b7;
            --error: #f43f5e;
            --error-light: #fda4af;
            --warning: #f59e0b;
            --warning-light: #fcd34d;
            --border: #2e2e3a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 5px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            color: white;
            box-shadow: var(--shadow);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-input::placeholder { color: var(--text-muted); }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .forgot-link {
            font-size: 0.85rem;
            color: var(--accent-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover { color: var(--accent); }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px); 
            box-shadow: var(--shadow); 
        }

        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn svg { width: 18px; height: 18px; }

        .message {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
            border-left: 4px solid;
        }

        .message svg { width: 18px; height: 18px; flex-shrink: 0; }
        .message.error { 
            display: flex;
            background: rgba(239, 68, 68, 0.1); 
            border-color: var(--error); 
            color: var(--error-light); 
        }
        .message.success { 
            display: flex;
            background: rgba(34, 197, 94, 0.1); 
            border-color: var(--success); 
            color: var(--success-light); 
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 12px;
        }

        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
        }

        .theme-toggle svg { width: 20px; height: 20px; }

        .light-theme {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --bg-card: #ffffff;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .form-options { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">J</div>
                <h1>JunifyDB Console</h1>
                <p>Sign in to access your database</p>
            </div>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="showForgotPassword(); return false;">Forgot password?</a>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Sign In
                </button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="btn btn-ghost" onclick="useApiKey()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/>
                </svg>
                Use API Key
            </button>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal-overlay" onclick="if(event.target === this) closeApiKeyModal()">
        <div class="modal">
            <h3 style="font-size: 1.2rem; margin-bottom: 12px;">Enter API Key</h3>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Provide your API key to access the console</p>
            <div class="form-group">
                <label class="form-label" for="apiKeyInput">API Key</label>
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    class="form-input" 
                    placeholder="Enter your API key"
                >
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn btn-ghost" onclick="closeApiKeyModal()">Cancel</button>
                <button class="btn" onclick="submitApiKey()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let isLightTheme = false;

        function toggleTheme() {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light-theme', isLightTheme);
            localStorage.setItem('theme', isLightTheme ? 'light' : 'dark');
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'light') {
            isLightTheme = true;
            document.body.classList.add('light-theme');
        }

        // Check if already authenticated
        checkExistingAuth();

        function checkExistingAuth() {
            const apiKey = sessionStorage.getItem('apiKey');
            const userInfo = sessionStorage.getItem('userInfo');
            const expiry = sessionStorage.getItem('sessionExpiry');

            if (apiKey && expiry) {
                const now = Date.now();
                if (now < expiry) {
                    // Valid session, redirect to console
                    window.location.href = 'index.html';
                } else {
                    // Session expired, clear it
                    clearSession();
                }
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const messageEl = document.getElementById('loginMessage');

            if (!username || !password) {
                showMessage('Please enter username and password', 'error');
                return;
            }

            // Disable button during login
            loginBtn.disabled = true;
            loginBtn.innerHTML = `
                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" opacity="0.3"/>
                    <path d="M12 2a10 10 0 0 1 10 10" opacity="0.8"/>
                </svg>
                Signing in...
            `;

            try {
                // Attempt login via API
                const response = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store session info
                    const expiryTime = Date.now() + (30 * 60 * 1000); // 30 minutes
                    sessionStorage.setItem('apiKey', data.apiKey);
                    sessionStorage.setItem('sessionExpiry', expiryTime.toString());
                    sessionStorage.setItem('userInfo', JSON.stringify({
                        username: data.username,
                        role: data.role
                    }));

                    if (rememberMe) {
                        localStorage.setItem('rememberedUsername', username);
                    }

                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Login failed. Please check your credentials.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Sign In
                    `;
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Sign In
                `;
            }
        }

        function useApiKey() {
            document.getElementById('apiKeyModal').classList.add('active');
            document.getElementById('apiKeyInput').focus();
        }

        function closeApiKeyModal() {
            document.getElementById('apiKeyModal').classList.remove('active');
            document.getElementById('apiKeyInput').value = '';
        }

        function submitApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            
            if (!apiKey) {
                showMessage('Please enter an API key', 'error');
                return;
            }

            const expiryTime = Date.now() + (30 * 60 * 1000); // 30 minutes
            sessionStorage.setItem('apiKey', apiKey);
            sessionStorage.setItem('sessionExpiry', expiryTime.toString());
            sessionStorage.setItem('userInfo', JSON.stringify({
                username: 'api-user',
                role: 'USER'
            }));

            closeApiKeyModal();
            window.location.href = 'index.html';
        }

        function showForgotPassword() {
            alert('Password reset functionality is not yet implemented.\n\nPlease contact your administrator to reset your password.');
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('loginMessage');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            
            if (type === 'success') {
                messageEl.style.display = 'flex';
            } else {
                messageEl.style.display = 'flex';
            }
        }

        function clearSession() {
            sessionStorage.removeItem('apiKey');
            sessionStorage.removeItem('sessionExpiry');
            sessionStorage.removeItem('userInfo');
        }

        // Add spinner animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin { to { transform: rotate(360deg); } }
            .spinner { animation: spin 1s linear infinite; }
        `;
        document.head.appendChild(style);

        // Load remembered username
        const rememberedUser = localStorage.getItem('rememberedUsername');
        if (rememberedUser) {
            document.getElementById('username').value = rememberedUser;
            document.getElementById('rememberMe').checked = true;
        }
    </script>
</body>
</html>
